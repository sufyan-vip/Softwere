name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Only the most recent push per branch matters.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      # One Gradle invocation with --continue: every compile error in the repo is
      # reported in this single run instead of stopping at the first failing task.
      - name: Lint, unit tests and assemble APKs
        run: |
          set -o pipefail
          ./gradlew --continue --stacktrace \
            lintDebug testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee /tmp/gradle-build.log

      - name: Verify APKs
        run: |
          set -e
          echo "--- Generated APKs ---"
          find app/build/outputs/apk -name '*.apk' -print -exec ls -lh {} \;
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            test -s "$apk" || { echo "FAIL: $apk is empty"; exit 1; }
            unzip -l "$apk" | grep -q AndroidManifest.xml || { echo "FAIL: $apk has no manifest"; exit 1; }
            unzip -l "$apk" | grep -q classes.dex || { echo "FAIL: $apk has no dex"; exit 1; }
            echo "PASS: $apk is a valid Android package"
          done
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging \
            app/build/outputs/apk/release/app-release.apk | head -5 || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sufyan-harness-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sufyan-harness-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      # Failure reasons are turned into check annotations, so the root cause is
      # readable from the run page even when the raw log is hard to open.
      - name: Report build errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os

          LOG = "/tmp/gradle-build.log"
          lines = []
          if os.path.exists(LOG):
              lines = open(LOG, encoding="utf-8", errors="replace").read().splitlines()

          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def emit(msg):
              print("::error::" + esc(msg.strip())[:1200])

          errors = [l.strip() for l in lines if l.startswith("e: ") or ": error:" in l]
          errors = list(dict.fromkeys(errors))
          if errors:
              emit(f"{len(errors)} compiler error(s). First {min(len(errors), 9)} listed below.")
              for e in errors[:9]:
                  emit(e)
          else:
              start = next((i for i, l in enumerate(lines) if l.startswith("FAILURE: Build failed")), None)
              if start is None:
                  emit("Build failed and no compiler error was found in the Gradle output. Last lines:")
                  emit("\n".join(lines[-15:]))
              else:
                  block, i = [], start
                  while i < len(lines) and not lines[i].startswith("* Try:"):
                      if lines[i].strip():
                          block.append(lines[i].strip())
                      i += 1
                  emit("\n".join(block[:14]))
          PY
